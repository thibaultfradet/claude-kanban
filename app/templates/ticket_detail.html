<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>#{{ ticket.id }} — {{ ticket.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <header>
    <a href="/" class="btn btn-icon" aria-label="Retour au board">←</a>
    <h1>Claude Kanban</h1>
  </header>

  <div class="modal" style="width: min(720px, 100%); margin: 0 auto;">
    <div class="modal-body" style="padding-top: 20px;" id="standalone-ticket">
      {% include "_ticket_fragment.html" %}
    </div>
  </div>

  <div class="toast-container" id="toast-container" aria-live="polite"></div>

  <script src="/static/app.js"></script>
  <script>
    window.KanbanTicket.bind(document.getElementById("standalone-ticket"), {{ ticket.id }});
  </script>
</body>
</html>
